# Dependabot — version updates (security alerts are separate in repo Settings → Security).
# Cargo workspace root is the repository root (see root Cargo.toml).
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - rust
    # Pinned to 1.0.0-rc.29 — do not auto-PR sea-query into rc.30 … rc.33 (known churn).
    # When ready (e.g. 1.0.0 stable or a chosen RC), remove entries or add new ignores.
    ignore:
      - dependency-name: "sea-query"
        versions:
          - "1.0.0-rc.30"
          - "1.0.0-rc.31"
          - "1.0.0-rc.32"
          - "1.0.0-rc.33"
    groups:
      # Same group, patterns and Monday 09:00 UTC slot in every Microscaler Rust repo: the crates they all compile
      # move to the same versions in the same week, which is what lets the shared sccache on the ms02 CI runners hit
      # across repos. Majors still arrive one PR each.
      shared-stack:
        patterns: ["tokio*", "serde*", "hyper*", "http-body*", "tower*", "tracing*", "opentelemetry*", "prost*",
                   "tonic*", "rustls*", "ring", "aws-lc*", "cc", "openssl*", "reqwest*", "chrono*", "uuid", "anyhow",
                   "thiserror*", "clap*", "jsonwebtoken", "redis*", "futures*", "bytes", "regex*", "syn", "quote",
                   "proc-macro2", "rand*", "base64", "sha2", "hmac", "ed25519*", "time", "url", "once_cell",
                   "parking_lot*", "dashmap", "smallvec", "itoa", "memchr", "hashbrown", "indexmap", "pyroscope*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - github-actions
